<!DOCTYPE html>
<html>
<head>
  <title>Prime Number Check</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background-color:aquamarine;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      margin: auto;
    }

    input {
      padding: 8px;
      width: 80%;
      margin: 10px 0;
    }

    button {
      padding: 8px 15px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: rgb(0, 102, 139);
    }

    #result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h3>Prime Number Check</h3>

  <input type="number" id="num" placeholder="Enter number">
  <br>
  <button onclick="checkPrime()">Check</button>

  <p id="result"></p>
</div>

<script>
function checkPrime() {
  let num = document.getElementById("num").value;
  let isPrime = true;

  if (num <= 1) {
    isPrime = false;
  } else {
    for (let i = 2; i < num; i++) {
      if (num % i == 0) {
        isPrime = false;
        break;
      }
    }
  }

  if (isPrime) {
    document.getElementById("result").innerHTML = "Prime Number";
  } else {
    document.getElementById("result").innerHTML = "Not Prime Number";
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Student Information Project</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #eeeeee;
            border: 2px solid #333;
            padding: 20px;
            width: 350px;
            text-align: center;
        }

        /* The Student Card Styling */
        .student-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
        }

        .student-card h2 {
            margin: 10px 0;
            color: #333;
        }

        .student-card p {
            margin: 5px 0;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        // 1. Create the Student component
        // 2. It accepts 'props' as an argument
        function Student(props) {
            return (
                <div className="student-card">
                    <h2>{props.name}</h2>
                    <p>Course: {props.course}</p>
                    <p>Marks: {props.marks}</p>
                </div>
            );
        }

        function App() {
            return (
                <div className="container">
                    <h1>Student Information</h1>
                    
                    {/* 4. Use the component multiple times with different data */}
                    <Student name="Rahul Sharma" course="Computer Science" marks="85" />
                    <Student name="Anita Verma" course="Information Technology" marks="92" />
                    <Student name="Rohan Gupta" course="Electronics" marks="78" />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

    </script>

</body>
</html>

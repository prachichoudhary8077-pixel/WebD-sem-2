<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {  background-image: url('background\ image.avif'); }
        
        .navbar-dark-custom {
            background-color: #333;
        }
        
       .card{
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 15px;
        color: white;
        }
        
        .card:hover { transform: translateY(-5px); }

        .product-img {
            height: 300px;
            object-fit: contain;
            padding: 20px;
        }

        .footer-custom{
            background-color: rgba(17,17,17,0.9);
            padding: 20px 0;
            color: #ccc;
        }

        .footer-name{
            color: #00BFFF;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00BFFF;
            transition: 0.3s;
        }

        .footer-name:hover{
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-dark-custom">
        <div class="container">
            <a class="navbar-brand" href="#">TechStore</a>
            <div class="ms-auto">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Product</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 p-3">
                    <img src="m3-macbook-air-profile-top.webp" class="product-img card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5 class="card-title">Laptop</h5>
                        <p class="card-text text-muted small">High performance laptop</p>
                        <div class="d-flex align-items-center mb-3">
                            <span class="fw-bold me-2">₹50,000</span>
                            <span class="badge bg-dark">New</span>
                        </div>
                        <a href="#" class="btn btn-primary w-100">View Details</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 p-3">
                    <img src="iphone15.avif" class="product-img card-img-top" alt="Mobile">
                    <div class="card-body">
                        <h5 class="card-title">Mobile</h5>
                        <p class="card-text text-muted small">Latest smartphone</p>
                        <div class="d-flex align-items-center mb-3">
                            <span class="fw-bold me-2">₹30,000</span>
                            <span class="badge bg-danger">Sale</span>
                        </div>
                        <a href="#" class="btn btn-primary w-100">View Details</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 p-3">
                    <img src="headphone.avif" class="product-img card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text text-muted small">Noise cancelling</p>
                        <div class="d-flex align-items-center mb-3">
                            <span class="fw-bold me-2">₹5,000</span>
                            <span class="badge bg-dark">New</span>
                        </div>
                        <a href="#" class="btn btn-primary w-100">View Details</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-custom text-center mt-5">
    <div class="container">
        <p class="mb-1">@ 2026 TechStore</p>
        <h4 class="footer-name"> By PRACHI CHOUDHARY</h4>
    </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
